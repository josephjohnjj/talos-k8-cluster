---
- name: Bootstrap Talos and render ingress hostnames
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    repository_dir: "{{ playbook_dir }}/../.."
    hostname_pattern: '[0-9]{1,3}(?:\.[0-9]{1,3}){3}\.nip\.io'
    ipv4_pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
    terraform_dir: "{{ playbook_dir }}/../02-terraform"
    generated_dir: "{{ playbook_dir }}/../01-prepare-talos/generated"
  tasks:
    - name: Bootstrap a new cluster or retrieve its kubeconfig
      when: (bootstrap_cluster | default(false) | bool) or (retrieve_kubeconfig | default(false) | bool)
      block:
        - name: Check whether kubeconfig already exists
          ansible.builtin.stat:
            path: "{{ generated_dir }}/kubeconfig"
          register: kubeconfig

        - name: Check for a previous bootstrap attempt
          ansible.builtin.stat:
            path: "{{ generated_dir }}/bootstrap-attempted"
          register: bootstrap_attempt

        - name: Prevent a repeated bootstrap
          ansible.builtin.assert:
            that:
              - not kubeconfig.stat.exists
              - not (bootstrap_cluster | default(false) | bool) or not bootstrap_attempt.stat.exists
              - not ((bootstrap_cluster | default(false) | bool) and (retrieve_kubeconfig | default(false) | bool))
            fail_msg: >-
              A kubeconfig or bootstrap attempt already exists, or both flags were set.
              To retrieve a missing kubeconfig after successful bootstrap, use
              retrieve_kubeconfig=true without bootstrap_cluster.

        - name: Read the public Talos endpoint
          ansible.builtin.command:
            argv: [terraform, "-chdir={{ terraform_dir }}", output, -raw, controlplane_api_public_ip]
          register: endpoint
          changed_when: false

        - name: Read the control-plane node IPs
          ansible.builtin.command:
            argv: [terraform, "-chdir={{ terraform_dir }}", output, -json, control_node_private_ip]
          register: nodes
          changed_when: false

        - name: Check Talos API connectivity on control1
          ansible.builtin.command:
            argv:
              - talosctl
              - --talosconfig
              - "{{ generated_dir }}/talosconfig"
              - --endpoints
              - "{{ endpoint.stdout }}"
              - --nodes
              - "{{ nodes.stdout | from_json | first }}"
              - version
          register: talos_version
          until: talos_version.rc == 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Save the API endpoint in talosconfig
          ansible.builtin.command:
            argv: [talosctl, config, endpoint, "{{ endpoint.stdout }}", --talosconfig, "{{ generated_dir }}/talosconfig"]

        - name: Record and send the one-time bootstrap request
          when: bootstrap_cluster | default(false) | bool
          block:
            - name: Record that bootstrap is about to be requested
              ansible.builtin.copy:
                dest: "{{ generated_dir }}/bootstrap-attempted"
                content: "{{ endpoint.stdout }}\n"
                mode: "0600"
                force: false

            - name: Bootstrap etcd on control1
              ansible.builtin.command:
                argv: [talosctl, bootstrap, --talosconfig, "{{ generated_dir }}/talosconfig", --endpoints, "{{ endpoint.stdout }}", --nodes, "{{ nodes.stdout | from_json | first }}"]

        - name: Retrieve kubeconfig from control1
          ansible.builtin.command:
            argv: [talosctl, kubeconfig, "{{ generated_dir }}/kubeconfig", --talosconfig, "{{ generated_dir }}/talosconfig", --endpoints, "{{ endpoint.stdout }}", --nodes, "{{ nodes.stdout | from_json | first }}"]

        - name: Wait for the Kubernetes API to respond
          ansible.builtin.command:
            argv: [kubectl, --kubeconfig, "{{ generated_dir }}/kubeconfig", get, nodes, -o, wide]
          register: kubernetes_nodes
          until: kubernetes_nodes.rc == 0
          retries: 30
          delay: 10
          changed_when: false

        - name: Show Kubernetes nodes
          ansible.builtin.debug:
            var: kubernetes_nodes.stdout_lines

    - name: Read the ingress Elastic IP
      ansible.builtin.command:
        argv: [terraform, "-chdir={{ terraform_dir }}", output, -json, login_node_public_ips]
      register: ingress_output
      changed_when: false

    - name: Require exactly one valid ingress IPv4 address
      ansible.builtin.assert:
        that:
          - ingress_ips | type_debug == 'list'
          - ingress_ips | length == 1
          - ingress_ips[0] is match(ipv4_pattern)
      vars:
        ingress_ips: "{{ ingress_output.stdout | from_json }}"

    - name: Find the ingress manifest files
      ansible.builtin.find:
        paths:
          - "{{ repository_dir }}/argocd/ingresses"
          - "{{ repository_dir }}/manifests/ingress"
        patterns: ['*.yaml', '*.yml']
        recurse: true
      register: manifests

    - name: Require both ingress manifest directories
      ansible.builtin.assert:
        that: manifests.skipped_paths | length == 0

    - name: Render and verify public hostnames
      vars:
        public_domain: "{{ (ingress_output.stdout | from_json | first) ~ '.nip.io' }}"
        paths: "{{ (manifests.files | map(attribute='path') | list) + chart_values }}"
        chart_values:
          - "{{ repository_dir }}/charts/gen3/values/gen3-values.yaml"
          - "{{ repository_dir }}/charts/gen3-2025.08/values/gen3-values.yaml"
      block:
        - name: Render the ingress domain in each file
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: "{{ hostname_pattern }}"
            replace: "{{ public_domain }}"
          loop: "{{ paths }}"
          diff: false

        - name: Verify no stale hostnames remain
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: "{{ hostname_pattern }}"
            replace: "{{ public_domain }}"
          loop: "{{ paths }}"
          check_mode: true
          diff: false
          register: hostname_checks
          failed_when: hostname_checks.changed and not ansible_check_mode
